---
defaults:
  crosswork:
    administration:
      users:
        locked: false
    aaa:
      tacacs_servers:
        port: 49
        secret_format: ascii
        retries: 0
        auth_type: pap
        device_access_group_attribute: deviceAccessGroups
      radius_servers:
        port: 1645
        secret_format: ascii
        retries: 0
        auth_type: pap
        device_access_group_attribute: deviceAccessGroups
      ldap_servers:
        user_filter: uid={user}
        connect_timeout: 5
        device_access_group_attribute: deviceAccessGroups
      session_settings:
        fallback: no-response-or-authentication-failure
        idle_timeout: 30m
        parallel_sessions: 100
        parallel_sessions_per_user: 100
        source_ip_auditing: false
      password_policies:
        min_length: 8
        no_username: true
        no_cisco_variant: true
        no_char_repetition: true
        change_on_first_login: true
        min_changed_characters: 1
        password_reuse_limit: 5
        password_reuse_days: 15
        lockout_attempts: 5
        lockout_minutes: 6
        expiry_days: 60
        expiry_warning_days: 15
    services:
      l2vpn:
        vpn_services:
          service_assurance:
            profile_type: system
            rule_type: system
      l3vpn:
        vpn_services:
          service_assurance:
            profile_type: system
            rule_type: system
      bandwidth_on_demand:
        basic:
          enable: false
          primary_objective: max-available-bandwidth
          link_utilization_threshold_percent: 80
          reoptimization_interval_seconds: 60
          metric_reoptimization_time: "01:30"
        advanced:
          sr_policy_traffic: max-measured-requested
          update_throttle_seconds: 0
          optimizer_event_threshold_seconds: 45
          optimizer_run_time_limit_seconds: 60
          policy_violations: loose
          prefer_strict_sids: false
          debug_optimizer: false
          debug_optimizer_max_files: 30
      demand_matrix:
        global:
          computation_cadence_minutes: 15
          minimum_demand_traffic_kbps: 0
          debug_mode: false
          debug_max_plan_files: 1
        domains:
          enable: false
    data_gateways:
      pools:
        spares: 0
        cdg_readiness_timeout: 60
      resource_configurations:
        update_timeout: 120
      collection_jobs:
        cadence:
          reachability_check:
            hours: 0
            minutes: 10
          snmp_check:
            hours: 0
            minutes: 20
          te_tunnel_id:
            hours: 0
            minutes: 20
          show_clock:
            hours: 0
            minutes: 30
    device_management:
      performance_policies:
        active: true
        metrics:
          thresholds:
            conditions:
              type: alarm
    golden_configuration:
      templates:
        mode: merge
        config_type: native
        vendor: Cisco Systems
        software_type: IOS XR
        global_schedule_audit: true
        order: 0
        mop: Default Golden Config - Cisco
        parallel_execution: 1
        deployment_timeout: 900
        force_delete: false
    system_settings:
      pre_login_disclaimer:
        enabled: false
        require_acknowledgement: false
        title: Crosswork Legal Disclaimer
        message: Welcome to Cisco Crosswork. Logging into the system means that you acknowledge and agree to comply with Cisco Crosswork terms and conditions.
        icon: info
      survey:
        enabled: true
      file_servers:
        ftp_enabled: false
        sftp_upload_enabled: false
      smart_licensing:
        mode: direct
      data_retention:
        device_performance:
          raw_retention_hours: 24
          hourly_retention_days: 7
          daily_retention_days: 31
          weekly_retention_weeks: 54
        network_performance:
          collect_lsp_state_change: true
          collect_lsp_path_change: true
          collect_lsp_utilization: true
          collect_lsp_pm: false
          collect_link_pm: false
          raw_retention_hours: 24
          hourly_retention_days: 7
          daily_retention_days: 31
          weekly_retention_weeks: 52
      performance_monitoring:
        health_settings:
          optical_zrp:
            unit: bps
      topology:
        metric_thresholds:
          unit: ms
        discovery:
          lldp: false
          cdp: false
          lag: false
      traffic_engineering:
        general_settings:
          policy_unused_threshold_kbps: 1000
          policy_provisioning_timeout_seconds: 60
          bandwidth_on_demand_provisioning_timeout_seconds: 90
          igp_path_request_timeout_seconds: 180
          policy_details_request_timeout_seconds: 180
      alarms_and_events:
        cleanup_options:
          security_device_alarms_cleared_days: 30
          non_security_device_alarms_cleared_days: 7
          all_events_days: 30
          device_alarms_days: 60
          system_alarms_days: 60
          network_alarms_days: 60
          audit_logs_days: 30
        general:
          trap_processing: true
          syslog_processing: true
        notification_destinations:
          trap_receivers:
            port: 162
            snmp_version: v2c
            notification_type: udp
          syslog_receivers:
            port: 514
            protocol: udp
    providers:
      nso_policies:
        match: true
        match_rule: "*"
        onboard_to_nso: true
        onboard_to_nso_rule: "*"
        onboard_from_nso: false
        onboard_from_nso_rule: "*"
        sync_from_nso: true
        sync_from_nso_rule: "*"
        check_sync: true
        check_sync_rule: "*"
