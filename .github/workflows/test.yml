name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: testing_environment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.0

      # Temporary: the provider is not in the Terraform Registry yet, so every run builds it from source.
      # Remove the Go Setup, Build and Provider Mirror steps once CiscoDevNet/crosswork is published.
      - name: Go Setup
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build Local Crosswork Provider
        run: |
          echo "Setting up local Crosswork provider..."

          # Set up Go environment
          export GOPATH=$HOME/go
          export PATH=$GOPATH/bin:$PATH
          go version

          # Clone and build provider from source
          git clone https://github.com/netascode/terraform-provider-crosswork.git /tmp/terraform-provider-crosswork
          cd /tmp/terraform-provider-crosswork
          git checkout main
          go install

          echo "Provider binary installed at: $GOPATH/bin"
          ls -la $GOPATH/bin/terraform-provider-crosswork || echo "Binary not found"

      - name: Configure Terraform Provider Mirror
        run: |
          # Install the provider build from a local mirror, as the Registry does not have it yet.
          # The version in the path must satisfy the constraint of versions.tf.
          MIRROR=$HOME/terraform-mirror
          DIR=$MIRROR/registry.terraform.io/ciscodevnet/crosswork/0.1.0/linux_amd64
          mkdir -p $DIR
          cp $HOME/go/bin/terraform-provider-crosswork $DIR/terraform-provider-crosswork_v0.1.0

          cat > $HOME/.terraformrc << EOF
          provider_installation {
            filesystem_mirror {
              path    = "$MIRROR"
              include = ["CiscoDevNet/crosswork"]
            }
            direct {
              exclude = ["CiscoDevNet/crosswork"]
            }
          }
          EOF

          echo "Terraform configuration:"
          cat $HOME/.terraformrc

      - name: Tflint Setup
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform Docs Setup
        run: |
          mkdir terraform-docs && cd terraform-docs
          curl -sSLo terraform-docs.tar.gz https://terraform-docs.io/dl/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          echo "$GITHUB_WORKSPACE/terraform-docs" >> $GITHUB_PATH

      - name: Pre-commit Checks
        uses: pre-commit/action@v3.0.1

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color
